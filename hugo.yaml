baseURL: http://localhost:1313/
title: Proofcraft
defaultContentLanguage: zh

enableRobotsTXT: true
enableGitInfo: false

outputs:
  home:
    - HTML
    - RSS
    - JSON

params:
  description: "Rust · 零知识证明 · 区块链 —— 网络空间安全博士的学习笔记"
  navbar:
    displayTitle: true
    displayLogo: true
  sidebar:
    hide: false
  toc:
    enable: true
  editURL:
    enable: false
  search:
    enable: true
  footer:
    enable: false

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false

module:
  imports:
    - path: github.com/imfing/hextra
    - path: github.com/oliverustc/proofcraft-content
  mounts:
    - source: content
      target: content
    - source: static
      target: static
    - source: layouts
      target: layouts
    - source: assets
      target: assets
